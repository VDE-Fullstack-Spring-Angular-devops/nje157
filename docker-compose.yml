version: '3.8'

services:

  mysql:
    image: mysql:8.0.41
    container_name: etudiant-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etudiantdb
    ports:
      - "3307:3306"
    volumes:
      - ./gestion-etudiants/src/main/docker/mysql-data:/var/lib/mysql
      - ./gestion-etudiants/src/main/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./gestion-etudiants
    container_name: etudiant-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/etudiantdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "9000:9000"

  frontend:
    build: ./gestion-student
    container_name: etudiant-frontend
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:9000
    ports:
      - "4200:4200"
